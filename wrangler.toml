# Static page served under theaipipe.com/demos/one-script-video-flow/
name = "one-script-video-flow-demo"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [
  { pattern = "theaipipe.com/demos/one-script-video-flow", zone_name = "theaipipe.com" },
  { pattern = "theaipipe.com/demos/one-script-video-flow/*", zone_name = "theaipipe.com" }
]

[assets]
directory = "./site"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
run_worker_first = true
