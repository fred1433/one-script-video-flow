# n8n orchestrates; the render service (Blender, Kokoro, ffmpeg) runs on the host at 127.0.0.1:8790.
# n8n sits on an internal network with no route out. The relay is its only door, and it forwards
# exactly two ports: the n8n editor/webhooks to 127.0.0.1:5678 and n8n's calls to the render service.
services:
  n8n:
    image: n8nio/n8n:2.46.6
    entrypoint: ["tini", "--", "sh", "-c", "n8n import:workflow --input=/flow/workflow.json && n8n publish:workflow --id=OneScriptFlow001 && exec n8n start"]
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_WEBHOOK_URL=http://localhost:5678/
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_TEMPLATES_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - GENERIC_TIMEZONE=Europe/London
      - TZ=Europe/London
    volumes:
      - ./n8n:/flow:ro
      - n8n_data:/home/node/.n8n
    networks: [studio]
  relay:
    image: alpine/socat:1.8.0.3
    entrypoint: ["sh", "-c", "socat TCP-LISTEN:5678,fork,reuseaddr TCP:n8n:5678 & exec socat TCP-LISTEN:8790,fork,reuseaddr TCP:host.docker.internal:8790"]
    ports:
      - "127.0.0.1:5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [studio, outside]
networks:
  studio:
    internal: true
  outside: {}
volumes:
  n8n_data: {}
